name: Keep Render backend warm

on:
  # Cloudflare's applyengine-render-keepalive Worker now runs the scheduled
  # health check. Keep this workflow only as a manual fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check ApplyEngine API health
        run: |
          curl --fail --show-error --silent \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://applyengine-api.onrender.com/api/health
